name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  GO_VERSION: '1.25'
  MIN_GO_VERSION: '1.25'

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.semver.outputs.version_tag }}
      version: ${{ steps.semver.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Semver
      uses: paulhatch/semantic-version@v5.4.0
      with:
        bump_each_commit: true
        tag_prefix: "v"
        format: "${major}.${minor}.${patch}"
        major_pattern: "BREAKING CHANGE:"
        minor_pattern: "feat:"
        version_from_branch: false
        change_path: "."
        namespace: ""
      id: semver

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: make deps

    - name: Run tests
      run: make test

    - name: Build
      run: make build

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        verify: false  # Disable schema validation for custom linters
        args: --timeout=30m --config=.golangci.local.yml

    - name: Lint Self
      run: make lint-self

  # Test Go version compatibility matrix
  compatibility-test:
    name: Go Version Compatibility Test
    runs-on: ubuntu-latest
    strategy:
      # One impossible combination must not cancel twenty useful ones. Without
      # this, the first cell to fail cancels the rest and every sibling reports
      # "The operation was canceled", which hides the one real failure.
      fail-fast: false
      matrix:
        # Build versions are the Go toolchains namedreturns itself is compiled
        # with. The floor is 1.25 because golang.org/x/tools requires it, and
        # x/tools is what reads the analyzed package's export data — an older
        # x/tools cannot parse a newer Go's format, which is the whole reason
        # this matrix exists.
        go-build-version: ['1.25', '1.26', '1.27']
        # Target versions are the Go versions of the ANALYZED codebase, which
        # is the compatibility that actually matters to users.
        go-target-version: ['1.21', '1.22', '1.23', '1.24', '1.25', '1.26', '1.27']
        # A binary can analyze any Go version up to and including the one it
        # was built with, never past it: go/types refuses a module whose go
        # directive is newer than the toolchain that compiled the analyzer, with
        #
        #   package requires newer Go version go1.27 (application built with go1.25)
        #
        # Those cells are impossible by construction rather than broken, so they
        # are excluded instead of being allowed to fail. This is also the rule
        # users hit: build namedreturns with a Go at least as new as the code it
        # analyzes.
        exclude:
          - go-build-version: '1.25'
            go-target-version: '1.26'
          - go-build-version: '1.25'
            go-target-version: '1.27'
          - go-build-version: '1.26'
            go-target-version: '1.27'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-build-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-build-version }}

    - name: Build namedreturns with Go ${{ matrix.go-build-version }}
      run: |
        go mod tidy
        go build -o namedreturns-${{ matrix.go-build-version }} .

    # The fixture spans TWO packages on purpose. A single self-contained
    # package is analyzed straight from source and never exercises the export
    # data path, so it stays green even when the analyzer cannot read a newer
    # Go's export format at all. An imported package forces that path, which is
    # the thing this matrix exists to test.
    #
    # The import is a second package in the same module rather than a third-
    # party one: `go mod tidy` would resolve a dependency whose own go directive
    # is newer than the target, rewrite go.mod, and quietly collapse every
    # target cell to the same modern Go version. No tidy, no network, and the
    # target version under test stays the one the matrix set.
    - name: Create test codebase with Go ${{ matrix.go-target-version }}
      run: |
        mkdir -p test-target-${{ matrix.go-target-version }}/helper
        cd test-target-${{ matrix.go-target-version }}
        echo "module test" > go.mod
        echo "" >> go.mod
        echo "go ${{ matrix.go-target-version }}.0" >> go.mod
        cat << 'EOF' > helper/helper.go
        package helper

        import "fmt"

        func Describe(v int) (text string, err error) {
            text = fmt.Sprintf("%d", v)
            return text, err
        }
        EOF
        cat << 'EOF' > main.go
        package main

        import "test/helper"

        func example() (result string, err error) {
            result, err = helper.Describe(1)
            return result, err
        }

        func badExample() (string, error) {
            return "bad", nil
        }
        EOF

    # This step asserts rather than reports. The previous version ended in
    # `|| echo "Expected some violations"`, which swallowed every failure mode
    # including a hard crash — so when a newer Go changed its export data
    # format and the analyzer died with "package \"fmt\" without types was
    # imported", the matrix stayed green and the breakage reached users. A
    # compatibility test that cannot fail is not a test.
    - name: Test compatibility (build=${{ matrix.go-build-version }}, target=${{ matrix.go-target-version }})
      run: |
        cd test-target-${{ matrix.go-target-version }}
        set +e
        output=$(../namedreturns-${{ matrix.go-build-version }} ./... 2>&1)
        status=$?
        set -e
        echo "$output"

        # A crash in the analysis framework is a failure, not a finding.
        if echo "$output" | grep -q "internal error"; then
          echo "::error::namedreturns built with Go ${{ matrix.go-build-version }} cannot analyze Go ${{ matrix.go-target-version }} codebases"
          exit 1
        fi

        # badExample has unnamed returns, so the analyzer must report it and
        # must exit non-zero. Silence here means the analyzer stopped working
        # without saying so.
        if ! echo "$output" | grep -q "unnamed return"; then
          echo "::error::expected an unnamed-return finding and got none"
          exit 1
        fi

        if [ "$status" -eq 0 ]; then
          echo "::error::expected a non-zero exit status with findings present"
          exit 1
        fi

        echo "namedreturns built with Go ${{ matrix.go-build-version }} analyzes Go ${{ matrix.go-target-version }} codebases"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Gate on BOTH jobs. Gating only on `test` let a release ship while the
    # compatibility matrix was failing.
    needs: [test, compatibility-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    # Exactly one step may create the tag, and it is this one: the release
    # creates tag_name at the current commit if it does not already exist.
    #
    # Do not add a separate tagging action alongside it. The semantic-version
    # step already emits version_tag v-prefixed, and github-tag-action prepends
    # its own default `v` to custom_tag, so running both produced a duplicate
    # vv-prefixed tag next to every real one.
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.test.outputs.version_tag }}
        name: ${{ needs.test.outputs.version_tag }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}